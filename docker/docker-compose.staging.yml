# =============================================================================
# Odoo 18 — STAGING
# =============================================================================
# Mirrors production + adds MailHog (mail catcher) for safe testing.
# Outgoing emails are intercepted, never sent to real customers.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: odoo_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - odoo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile.odoo
    container_name: odoo_app_staging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_data_staging:/var/lib/odoo
      - ./config/odoo/odoo.staging.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/custom-addons:ro
      - ./logs/odoo:/var/log/odoo
    networks:
      - odoo_internal
      - web
    expose:
      - "8069"
      - "8072"
    command: odoo -c /etc/odoo/odoo.conf --db_host=db --db_user=${POSTGRES_USER} --db_password=${POSTGRES_PASSWORD}

  mailhog:
    image: mailhog/mailhog:latest
    container_name: odoo_mailhog_staging
    restart: unless-stopped
    networks:
      - odoo_internal
      - web
    expose:
      - "1025"  # SMTP — receives mails from Odoo
      - "8025"  # Web UI — read mails in browser

  nginx:
    image: nginx:1.27-alpine
    container_name: odoo_nginx_staging
    restart: unless-stopped
    depends_on:
      - odoo
      - mailhog
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/odoo-staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - web

volumes:
  postgres_data_staging:
    driver: local
  odoo_data_staging:
    driver: local

networks:
  odoo_internal:
    driver: bridge
    internal: true
  web:
    driver: bridge
