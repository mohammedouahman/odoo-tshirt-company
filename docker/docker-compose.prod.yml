# =============================================================================
# Odoo 18 — PRODUCTION
# =============================================================================
# Full stack: Odoo + PostgreSQL + Nginx + Certbot
# Hardened for production use.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: odoo_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - odoo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NEVER expose db port to the host or internet in production
    # Only the odoo container can reach it via the internal network

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile.odoo
    container_name: odoo_app_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/custom-addons:ro
      - ./logs/odoo:/var/log/odoo
    networks:
      - odoo_internal
      - web
    expose:
      - "8069"
      - "8072"  # longpolling
    command: odoo -c /etc/odoo/odoo.conf

  nginx:
    image: nginx:1.27-alpine
    container_name: odoo_nginx_prod
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - web

volumes:
  postgres_data:
    driver: local
  odoo_data:
    driver: local

networks:
  odoo_internal:
    driver: bridge
    internal: true   # NO external access — db is fully isolated
  web:
    driver: bridge
