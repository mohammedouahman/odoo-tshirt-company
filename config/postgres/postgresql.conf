# =============================================================================
# PostgreSQL 16 — Tuned for Odoo on e2-standard-2 (2 vCPU, 8 GB RAM)
# =============================================================================
# Generated based on pgtune recommendations for OLTP workload.
# Adjust if you upgrade VM size.
# =============================================================================

# Connection settings
listen_addresses = '*'
max_connections = 100

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB

# Checkpoints
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Planner
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — for debugging slow queries
log_min_duration_statement = 1000   # log queries > 1s
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_timezone = 'UTC'

# WAL / replication-ready
wal_level = replica
max_wal_senders = 3
