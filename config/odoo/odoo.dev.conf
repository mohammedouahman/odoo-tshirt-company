[options]
; ============================================================================
; Odoo 18 — DEVELOPMENT CONFIG
; ============================================================================
; Single-process, dev mode, hot reload, full debugging.
; ============================================================================

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True       ; convenient for switching dbs in dev
admin_passwd = admin

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/custom-addons
data_dir = /var/lib/odoo

; Single-process for easier debugging (workers=0 disables multi-proc)
workers = 0
max_cron_threads = 1

xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069
longpolling_port = 8072
; No proxy_mode — direct browser access

logfile = /var/log/odoo/odoo.log
log_level = debug
log_handler = :DEBUG

; Allow demo data freely
without_demo = False

; MailHog
smtp_server = mailhog
smtp_port = 1025
smtp_ssl = False
