[options]
; ============================================================================
; Odoo 18 — STAGING CONFIG
; ============================================================================
; Lighter than production. Mail goes to MailHog (catcher).
; ============================================================================

db_host = db
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD}
list_db = False
admin_passwd = ${ODOO_ADMIN_PASSWORD}

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/custom-addons
data_dir = /var/lib/odoo

; e2-medium (1 vCPU, 4GB) — lower workers
workers = 3
max_cron_threads = 1

limit_memory_soft = 1073741824   ; 1 GB
limit_memory_hard = 1610612736   ; 1.5 GB
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = True

logfile = /var/log/odoo/odoo.log
log_level = info

; Demo data OK on staging if needed
without_demo = False

; MailHog — staging never sends real emails
smtp_server = mailhog
smtp_port = 1025
smtp_ssl = False
smtp_user = False
smtp_password = False
