[options]
; ============================================================================
; Odoo 18 — PRODUCTION CONFIG
; ============================================================================
; Hardened, performance-tuned for an e2-standard-2 VM (2 vCPU, 8GB RAM)
; ============================================================================

; --- Database ---
db_host = db
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD}
; List databases is DISABLED in production for security
list_db = False
; Master password (for DB management) — change this!
admin_passwd = ${ODOO_ADMIN_PASSWORD}

; --- Addons paths ---
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/custom-addons

; --- Data directory ---
data_dir = /var/lib/odoo

; --- Workers (production multi-process mode) ---
; Rule of thumb: workers = (2 * CPU) + 1
workers = 5
max_cron_threads = 2

; --- Memory limits per worker (in bytes) ---
; soft: worker recycles after this; hard: worker killed
limit_memory_soft = 2147483648    ; 2 GB
limit_memory_hard = 2684354560    ; 2.5 GB
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

; --- Network ---
xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = True   ; we sit behind nginx

; --- Logging ---
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
logrotate = True

; --- Security ---
; Disable demo data on production
without_demo = all
; Server-wide modules
server_wide_modules = base,web

; --- Email (production SMTP, configured via UI but defaults here) ---
; Configure in Settings → Technical → Outgoing Mail Servers
