# =============================================================================
# Nginx — Staging — Odoo + MailHog UI
# =============================================================================
# Routes:
#   /          → Odoo
#   /mail/     → MailHog UI (basic auth recommended)
# =============================================================================

upstream odoo {
    server odoo:8069;
}
upstream odoochat {
    server odoo:8072;
}
upstream mailhog {
    server mailhog:8025;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/odoo-staging-access.log;
    error_log /var/log/nginx/odoo-staging-error.log;

    location /longpolling {
        proxy_pass http://odoochat;
    }
    location /websocket {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- MailHog UI ---
    # Protect with basic auth — file generated by setup script
    location /mail/ {
        auth_basic "Mail Catcher";
        auth_basic_user_file /etc/nginx/.htpasswd;
        rewrite ^/mail/(.*)$ /$1 break;
        proxy_pass http://mailhog/;
    }

    location / {
        proxy_pass http://odoo;
    }

    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo;
    }
}
