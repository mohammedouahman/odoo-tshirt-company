# =============================================================================
# Nginx — Production reverse proxy for Odoo 18
# =============================================================================
# Handles: SSL termination, gzip, longpolling, static cache, security headers.
# Replace YOUR_PROD_HOSTNAME below with your nip.io or real domain.
# =============================================================================

upstream odoo {
    server odoo:8069;
}

upstream odoochat {
    server odoo:8072;
}

# --- HTTP → HTTPS redirect (enable after SSL cert obtained) ---
# server {
#     listen 80;
#     server_name YOUR_PROD_HOSTNAME;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80 default_server;
    # listen 443 ssl http2;
    server_name _;

    # --- SSL (uncomment after running certbot) ---
    # ssl_certificate /etc/letsencrypt/live/YOUR_PROD_HOSTNAME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_PROD_HOSTNAME/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # --- Security headers ---
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # enable with HTTPS

    # --- Sizes ---
    client_max_body_size 200M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # --- Proxy headers ---
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Gzip ---
    gzip on;
    gzip_min_length 1100;
    gzip_buffers 4 32k;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript application/pdf image/jpeg image/png;
    gzip_vary on;

    # --- Logging ---
    access_log /var/log/nginx/odoo-access.log;
    error_log /var/log/nginx/odoo-error.log;

    # --- Longpolling / chat / SSE ---
    location /longpolling {
        proxy_pass http://odoochat;
    }
    location /websocket {
        proxy_pass http://odoochat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # --- Main app ---
    location / {
        proxy_redirect off;
        proxy_pass http://odoo;
    }

    # --- Static files cache ---
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo;
    }
}
